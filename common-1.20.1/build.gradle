architectury {
    common(['fabric', 'forge'])
}

sourceSets.main.java.srcDir('../shared/minecraft-1.20plus/src/main/java')

configurations {
    shadowBundle
}

dependencies {
    // Depend on the shared pure-Java module
    implementation project(':common')

    // Fabric Loader annotations only (remapped per platform)
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    // Architectury API
    modImplementation "dev.architectury:architectury:$project.architectury_api_version"

    // OpenUI MC - compile against the matching 1.20.1 API; loaders provide the runtime mod.
    modCompileOnly "com.nstut:openui-mc-fabric-1.20.1:${rootProject.openui_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

processResources {
    // Version-neutral assets plus 1.21+-format data (ignored by the 1.20.1
    // datapack loader); 1.20.1 reads the plural dirs authored in this module.
    from(project(':common').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Include :common classes in the jar so they're available at runtime
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        project(':common').sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
}
