          git diff --check
          grep -R "AtomicStorageRestore.restoreEscrow" -n \
            shared/minecraft-1.20plus/src/main/java/com/nstut/economy/trading/OrderManager.java \
            neoforge-26.1.2/src/main/java/com/nstut/economy/trading/OrderManager.java
