name: PR22 one-shot review fix

on:
  push:
    branches:
      - feat/addon-api-platform

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/addon-api-platform
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/pr22_fix.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Lily"
          git config user.email "lily@localhost.invalid"
          git add -A
          git commit -m "Fix addon payload and escrow recovery invariants"
          git push origin HEAD:feat/addon-api-platform
