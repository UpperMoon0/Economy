          s=s.replace('import com.nstut.economy.core.AccountManager;','import com.nstut.economy.api.EconomyApi;\nimport com.nstut.economy.api.ICommodity;\nimport com.nstut.economy.api.internal.BuiltinContainerStorageProvider;\nimport com.nstut.economy.core.AccountManager;\nimport com.nstut.economy.trading.FluidCommodity;\nimport com.nstut.economy.trading.ItemCommodity;')
          s=s.replace('    private static com.nstut.economy.trading.OrderManager orderManager;','    private static com.nstut.economy.trading.OrderManager orderManager;\n    private static final BuiltinContainerStorageProvider BUILTIN_STORAGE = new BuiltinContainerStorageProvider();')
          s=s.replace('        orderManager = new com.nstut.economy.trading.OrderManager();\n','        orderManager = new com.nstut.economy.trading.OrderManager();\n        ensureApiRegistrations();\n')
          insert='''\n    /** Registers Economy-owned extension points before persisted orders are decoded. */\n    public static synchronized void ensureApiRegistrations() {\n        if (EconomyApi.commodityTypes().handler(ICommodity.ITEM_TYPE).isEmpty()) ItemCommodity.registerApiType();\n        if (EconomyApi.commodityTypes().handler(ICommodity.FLUID_TYPE).isEmpty()) FluidCommodity.registerApiType();\n        if (EconomyApi.storage().provider(BuiltinContainerStorageProvider.ID).isEmpty()) EconomyApi.storage().register(BUILTIN_STORAGE);\n    }\n'''
          s=s.replace('    public static AccountManager getAccountManager() {',insert+'\n    public static AccountManager getAccountManager() {')
          write(p,s)

          for p in ['shared/minecraft-1.20plus/src/main/java/com/nstut/economy/server/EconomyServerLifecycle.java','neoforge-26.1.2/src/main/java/com/nstut/economy/server/EconomyServerLifecycle.java']:
              s=read(p)
              s=s.replace('import com.nstut.Economy;','import com.nstut.Economy;\nimport com.nstut.economy.api.EconomyApi;\nimport com.nstut.economy.api.internal.DefaultMarketDataService;')
              s=s.replace('    public static void load(ServerLevel overworld) {\n','    public static void load(ServerLevel overworld) {\n        Economy.ensureApiRegistrations();\n')
              marker='        TankManager.setAccountData(accountData);\n'
