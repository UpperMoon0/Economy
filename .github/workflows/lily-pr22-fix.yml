          s=s.replace('\n    @SubscribeEvent\n    public static void onLevelSave(LevelEvent.Save event) {','\n    @SubscribeEvent\n    public static void onServerStopping(ServerStoppingEvent event) {\n        EconomyServerLifecycle.stop();\n        Economy.LOGGER.info("Economy data saved and API runtime unbound");\n    }\n\n    @SubscribeEvent\n    public static void onLevelSave(LevelEvent.Save event) {')
          write(p,s)

          # Stable facade, quarantine, events, provider-aware cancellation.
          managers=['shared/minecraft-1.20plus/src/main/java/com/nstut/economy/trading/OrderManager.java','neoforge-26.1.2/src/main/java/com/nstut/economy/trading/OrderManager.java']
          for p in managers:
              s=read(p)
              s=s.replace('import com.nstut.economy.api.ICommodity;\nimport com.nstut.economy.api.IOrder;','import com.nstut.economy.api.EconomyApi;\nimport com.nstut.economy.api.EconomyEvents;\nimport com.nstut.economy.api.ICommodity;\nimport com.nstut.economy.api.IOrder;\nimport com.nstut.economy.api.IOrderManager;\nimport com.nstut.economy.api.MarketEvents;\nimport com.nstut.economy.api.StorageReservation;')
              s=s.replace('public class OrderManager {','public class OrderManager implements IOrderManager {')
              s=s.replace('} else if (!snap.reservedItems.isEmpty() || !snap.reservedFluids.isEmpty()) {','} else if (snap.hasEscrow()) {')
              s=s.replace('if (snap == null || (snap.reservedItems.isEmpty() && snap.reservedFluids.isEmpty())) {','if (snap == null || !snap.hasEscrow()) {')
              s=s.replace('boolean holdsEscrow = !order.getReservedItems().isEmpty() || !order.getReservedFluids().isEmpty();','boolean holdsEscrow = !order.getReservedItems().isEmpty() || !order.getReservedFluids().isEmpty() || order.getExternalReservation() != null;')
              s=s.replace('return createSellOrder(owner, commodity, quantity, pricePerUnit, NonNullList.create(), null);','return createSellOrder(owner, commodity, quantity, pricePerUnit, NonNullList.create(), EconomyApi.serverLevel().orElse(null));')
              s=s.replace('return createBuyOrder(owner, commodity, quantity, pricePerUnit, false, null);','return createBuyOrder(owner, commodity, quantity, pricePerUnit, false, EconomyApi.serverLevel().orElse(null));')
              old='''        CreateOrderResult invalid = rejection(commodity, quantity, pricePerUnit);\n        if (invalid != null) {\n            return invalid;\n        }\n        Order order = new Order(owner, commodity, quantity, quantity, pricePerUnit, IOrder.OrderType.SELL, null,\n                copyStacks(reservedItems), copyFluidStacks(reservedFluids), false);'''
              new='''        CreateOrderResult invalid = rejection(commodity, quantity, pricePerUnit);\n        if (invalid != null) return invalid;\n        MarketEvents.OrderCreatePre pre = EconomyEvents.post(new MarketEvents.OrderCreatePre(owner, commodity, IOrder.OrderType.SELL, quantity, pricePerUnit));\n        if (pre.isCancelled()) {\n            if (level != null) {\n                if (reservedItems != null && !reservedItems.isEmpty()) com.nstut.economy.blocks.VaultManager.insertItemStacksToVaults(level, owner, copyStacks(reservedItems));\n                if (reservedFluids != null) for (var fs : reservedFluids) if (fs != null && !fs.isEmpty()) com.nstut.economy.blocks.TankManager.restoreFluidToTanks(level, owner, fs.copy());\n            }\n            return CreateOrderResult.rejected(quantity, "ui.economy.error.order_cancelled", List.of());\n        }\n        StorageReservation external = null;\n        if (level != null && (reservedItems == null || reservedItems.isEmpty()) && (reservedFluids == null || reservedFluids.isEmpty())) {\n            external = EconomyApi.storage().reserve(level, owner, commodity, quantity).orElse(null);\n            if (external == null) return CreateOrderResult.rejected(quantity, "ui.economy.error.insufficient_storage", List.of());\n        }\n        Order order = new Order(owner, commodity, quantity, quantity, pricePerUnit, IOrder.OrderType.SELL, null,\n                copyStacks(reservedItems), copyFluidStacks(reservedFluids), false);\n        if (external != null) order.setExternalReservation(external);'''
              if old not in s: raise SystemExit(f'{p}: sell creation block changed')
              s=s.replace(old,new,1)
              old='''        CreateOrderResult invalid = rejection(commodity, quantity, pricePerUnit);\n        if (invalid != null) {\n            return invalid;\n        }\n        Order order = new Order(owner, commodity, quantity, quantity, pricePerUnit, IOrder.OrderType.BUY, null, NonNullList.create(), isInfinite);'''
              new='''        CreateOrderResult invalid = rejection(commodity, quantity, pricePerUnit);\n        if (invalid != null) return invalid;\n        MarketEvents.OrderCreatePre pre = EconomyEvents.post(new MarketEvents.OrderCreatePre(owner, commodity, IOrder.OrderType.BUY, quantity, pricePerUnit));\n        if (pre.isCancelled()) return CreateOrderResult.rejected(quantity, "ui.economy.error.order_cancelled", List.of());\n        Order order = new Order(owner, commodity, quantity, quantity, pricePerUnit, IOrder.OrderType.BUY, null, NonNullList.create(), isInfinite);'''
              if old not in s: raise SystemExit(f'{p}: buy creation block changed')
              s=s.replace(old,new,1)
              # Publish created events for all accepted outcomes.
              s=s.replace('registerOrder(order);\n            return CreateOrderResult.posted(order, quantity, filled);','registerOrder(order);\n            EconomyEvents.post(new MarketEvents.OrderCreated(order, quantity, filled));\n            return CreateOrderResult.posted(order, quantity, filled);')
              s=s.replace('} else if (filled > 0) {\n            return CreateOrderResult.filled(quantity, filled);','} else if (filled > 0) {\n            EconomyEvents.post(new MarketEvents.OrderCreated(order, quantity, filled));\n            return CreateOrderResult.filled(quantity, filled);')
              # Server order events.
              s=s.replace('''        if (!com.nstut.economy.util.OrderInputValidator.isValidNewOrder(\n                quantity, pricePerUnit, commodity instanceof FluidCommodity)) return null;\n        Order order = new Order(SERVER_ID, commodity, quantity, pricePerUnit,\n                                IOrder.OrderType.BUY, null);''','''        if (!com.nstut.economy.util.OrderInputValidator.isValidNewOrder(\n                quantity, pricePerUnit, commodity instanceof FluidCommodity)) return null;\n        if (EconomyEvents.post(new MarketEvents.OrderCreatePre(SERVER_ID, commodity, IOrder.OrderType.BUY, quantity, pricePerUnit)).isCancelled()) return null;\n        Order order = new Order(SERVER_ID, commodity, quantity, pricePerUnit,\n                                IOrder.OrderType.BUY, null);''')
              s=s.replace('''        if (!com.nstut.economy.util.OrderInputValidator.isValidNewOrder(\n                quantity, pricePerUnit, commodity instanceof FluidCommodity)) return null;\n        Order order = new Order(SERVER_ID, commodity, quantity, pricePerUnit,\n                                IOrder.OrderType.SELL, null);''','''        if (!com.nstut.economy.util.OrderInputValidator.isValidNewOrder(\n                quantity, pricePerUnit, commodity instanceof FluidCommodity)) return null;\n        if (EconomyEvents.post(new MarketEvents.OrderCreatePre(SERVER_ID, commodity, IOrder.OrderType.SELL, quantity, pricePerUnit)).isCancelled()) return null;\n        Order order = new Order(SERVER_ID, commodity, quantity, pricePerUnit,\n                                IOrder.OrderType.SELL, null);''')
              s=s.replace('registerOrder(order);\n        return order;','registerOrder(order);\n        EconomyEvents.post(new MarketEvents.OrderCreated(order, quantity, 0));\n        return order;')
              # Public edit adapter and event.
              marker='    public boolean editOrder(UUID orderId, UUID requester, int newQuantity, java.math.BigDecimal newPrice, boolean isInfinite, net.minecraft.server.level.ServerLevel level) {'
              adapter='''    @Override\n    public boolean editOrder(UUID orderId, UUID requester, int newQuantity, java.math.BigDecimal newPrice, boolean isInfinite) {\n        return editOrder(orderId, requester, newQuantity, newPrice, isInfinite, EconomyApi.serverLevel().orElse(null));\n    }\n\n'''
              s=s.replace(marker,adapter+marker,1)
              s=s.replace('''        if (backingData != null) {\n            backingData.putOrder(order.toSnapshot());\n        }\n\n        matchAllPendingOrders(level);\n        return true;''','''        if (backingData != null) {\n            backingData.putOrder(order.toSnapshot());\n        }\n        EconomyEvents.post(new MarketEvents.OrderEdited(order));\n\n        matchAllPendingOrders(level);\n        return true;''',1)
              # Provider reservation cancellation must release through its owner.
              needle='''        if (order.getType() == IOrder.OrderType.SELL && !order.isServerOrder()\n                && (!order.getReservedItems().isEmpty() || !order.getReservedFluids().isEmpty())) {'''
              provider='''        if (order.getType() == IOrder.OrderType.SELL && !order.isServerOrder() && order.getExternalReservation() != null) {\n            if (level == null) return false;\n            var provider = EconomyApi.storage().provider(order.getExternalReservation().providerId()).orElse(null);\n            if (provider == null || !provider.release(level, order.getExternalReservation())) return false;\n            order.setExternalReservation(null);\n        }\n\n'''
              s=s.replace(needle,provider+needle,1)
              s=s.replace('''        if (order.cancel()) {\n            removeOrder(order);\n            return true;''','''        if (order.cancel()) {\n            removeOrder(order);\n            EconomyEvents.post(new MarketEvents.OrderCancelled(orderId, requester));\n            return true;''',1)
              write(p,s)

          # Provider-owned partial reservation state in settlement.
          p='shared/minecraft-all/src/main/java/com/nstut/economy/trading/Order.java'
          s=read(p)
          s=s.replace('''        int delivered = provider.deliverReserved(level, externalReservation, serverBuyer ? OrderManager.SERVER_ID : buyerId, amount);\n        if (delivered < amount) refund(sellerAccount, buyerAccount, buyerId, totalFor(amount - delivered), "Refund - partial provider delivery");\n        shrinkExternalReservation(delivered);''','''        StorageReservation beforeDelivery = externalReservation;\n        int delivered = provider.deliverReserved(level, beforeDelivery, serverBuyer ? OrderManager.SERVER_ID : buyerId, amount);\n        if (delivered < 0 || delivered > amount) throw new IllegalStateException("Storage provider returned invalid delivery amount: " + delivered);\n        if (delivered < amount) refund(sellerAccount, buyerAccount, buyerId, totalFor(amount - delivered), "Refund - partial provider delivery");\n        externalReservation = provider.remainingAfterDelivery(level, beforeDelivery, delivered).orElse(null);''')
          s=s.replace('''        int delivered = provider.deliverReserved(level, reservation, serverOrder ? OrderManager.SERVER_ID : owner, amount);\n        if (delivered < amount) refund(sellerAccount, buyerAccount, sellerId, totalFor(amount - delivered), "Refund - partial provider delivery");\n        int remaining = reservation.amount() - delivered;\n        if (remaining > 0) provider.release(level, resizeReservation(reservation, remaining));''','''        int delivered = provider.deliverReserved(level, reservation, serverOrder ? OrderManager.SERVER_ID : owner, amount);\n        if (delivered < 0 || delivered > amount) throw new IllegalStateException("Storage provider returned invalid delivery amount: " + delivered);\n        if (delivered < amount) refund(sellerAccount, buyerAccount, sellerId, totalFor(amount - delivered), "Refund - partial provider delivery");\n        var remainingReservation = provider.remainingAfterDelivery(level, reservation, delivered);\n        if (remainingReservation.isPresent() && !provider.release(level, remainingReservation.get()))\n            Economy.LOGGER.error("Provider {} failed to release remainder for reservation {}", provider.id(), reservation.token());''')
          start=s.find('    private void shrinkExternalReservation(int delivered) {')
          end=s.find('    private int commitBuiltInDelivery(', start)
          if start < 0 or end < 0: raise SystemExit('Order reservation helper block not found')
          s=s[:start]+s[end:]
          write(p,s)

          # Exact item escrow is serialized into provider-owned reservation metadata and survives Order SavedData reloads.
          p='shared/minecraft-all/src/main/java/com/nstut/economy/api/internal/BuiltinContainerStorageProvider.java'
          write(p,'''package com.nstut.economy.api.internal;\n\nimport com.nstut.economy.api.*;\nimport com.nstut.economy.blocks.TankManager;\nimport com.nstut.economy.blocks.VaultInventoryOps;\nimport com.nstut.economy.blocks.VaultManager;\nimport com.nstut.economy.trading.EconomyFluidStack;\nimport com.nstut.economy.trading.FluidCommodity;\nimport com.nstut.economy.trading.ItemCommodity;\nimport net.minecraft.core.NonNullList;\nimport net.minecraft.server.level.ServerLevel;\nimport net.minecraft.world.item.Item;\nimport net.minecraft.world.item.ItemStack;\n\nimport java.nio.charset.StandardCharsets;\nimport java.util.*;\n\n/** Built-in Vault/Tank adapter using durable, lossless provider-owned reservations. */\npublic final class BuiltinContainerStorageProvider implements IStorageProvider {\n    public static final EconomyId ID = EconomyId.of("economy", "containers");\n    private static final UUID SERVER_ID = new UUID(0L, 0L);\n    private static final String OWNER = "owner", TYPE = "typeId", STACKS = "itemStacks";\n\n    @Override public EconomyId id() { return ID; }\n    @Override public int priority() { return -100; }\n    @Override public boolean supports(ICommodity commodity) { return commodity instanceof ItemCommodity || commodity instanceof FluidCommodity; }\n\n    @Override public int available(ServerLevel level, UUID owner, ICommodity commodity) {\n        if (commodity instanceof ItemCommodity item) return VaultManager.countItemInVaults(level, owner, item.getItem());\n        if (commodity instanceof FluidCommodity fluid) return TankManager.countFluidInTanks(level, owner, fluid.getFluid());\n        return 0;\n    }\n\n    @Override public int receivable(ServerLevel level, UUID owner, ICommodity commodity, int requestedAmount) {\n        if (owner.equals(SERVER_ID)) return requestedAmount;\n        if (commodity instanceof ItemCommodity item) return VaultManager.countMaxAcceptableItems(level, owner, generateItemStacks(item.getItem(), requestedAmount));\n        if (commodity instanceof FluidCommodity fluid) return TankManager.simulateInsertFluidToTanks(level, owner, new EconomyFluidStack(fluid.getFluid(), requestedAmount));\n        return 0;\n    }\n\n    @Override public Optional<StorageReservation> reserve(ServerLevel level, UUID owner, ICommodity commodity, int amount) {\n        if (amount <= 0 || available(level, owner, commodity) < amount) return Optional.empty();\n        Map<String,String> meta = new HashMap<>(); meta.put(OWNER, owner.toString()); meta.put(TYPE, commodity.getTypeId().toString());\n        if (commodity instanceof ItemCommodity item) {\n            NonNullList<ItemStack> extracted = NonNullList.create();\n            if (!VaultManager.extractItemFromVaults(level, owner, item.getItem(), amount, extracted) || VaultInventoryOps.total(extracted) != amount) {\n                if (!extracted.isEmpty()) VaultManager.insertItemStacksToVaults(level, owner, extracted);\n                return Optional.empty();\n            }\n            meta.put(STACKS, encodeStacks(level, extracted));\n        } else if (commodity instanceof FluidCommodity fluid) {\n            List<EconomyFluidStack> drained = new ArrayList<>();\n            int actual = TankManager.extractFluidFromTanks(level, owner, fluid.getFluid(), amount, drained);\n            if (actual != amount) { for (EconomyFluidStack stack : drained) TankManager.restoreFluidToTanks(level, owner, stack); return Optional.empty(); }\n        } else return Optional.empty();\n        return Optional.of(new StorageReservation(ID, commodity.getId(), amount, UUID.randomUUID().toString(), Map.copyOf(meta)));\n    }\n\n    @Override public int deliverReserved(ServerLevel level, StorageReservation reservation, UUID receiver, int amount) {\n        int wanted = Math.min(amount, reservation.amount()); if (wanted <= 0) return 0;\n        ICommodity commodity = decode(reservation);\n        if (commodity instanceof ItemCommodity) {\n            NonNullList<ItemStack> escrow = decodeStacks(level, reservation); if (escrow == null) return 0;\n            NonNullList<ItemStack> delivery = takePrefix(escrow, wanted);\n            if (VaultInventoryOps.total(delivery) != wanted) return 0;\n            if (receiver.equals(SERVER_ID)) return wanted;\n            NonNullList<ItemStack> leftover = VaultManager.insertItemStacksToVaults(level, receiver, delivery);\n            return wanted - VaultInventoryOps.total(leftover);\n        }\n        if (commodity instanceof FluidCommodity fluid) {\n            if (receiver.equals(SERVER_ID)) return wanted;\n            return TankManager.insertFluidToTanks(level, receiver, new EconomyFluidStack(fluid.getFluid(), wanted));\n        }\n        return 0;\n    }\n\n    @Override public Optional<StorageReservation> remainingAfterDelivery(ServerLevel level, StorageReservation reservation, int deliveredAmount) {\n        if (deliveredAmount < 0 || deliveredAmount > reservation.amount()) throw new IllegalArgumentException("deliveredAmount outside reservation bounds");\n        int remaining = reservation.amount() - deliveredAmount; if (remaining == 0) return Optional.empty(); if (deliveredAmount == 0) return Optional.of(reservation);\n        Map<String,String> meta = new HashMap<>(reservation.metadata());\n        if (decode(reservation) instanceof ItemCommodity) {\n            NonNullList<ItemStack> escrow = decodeStacks(level, reservation); if (escrow == null) throw new IllegalStateException("Missing exact stack escrow for " + reservation.token());\n            NonNullList<ItemStack> rest = dropPrefix(escrow, deliveredAmount);\n            if (VaultInventoryOps.total(rest) != remaining) throw new IllegalStateException("Escrow amount mismatch for " + reservation.token());\n            meta.put(STACKS, encodeStacks(level, rest));\n        }\n        return Optional.of(new StorageReservation(ID, reservation.commodityId(), remaining, reservation.token(), Map.copyOf(meta)));\n    }\n\n    @Override public boolean release(ServerLevel level, StorageReservation reservation) {\n        String ownerValue = reservation.metadata().get(OWNER); if (ownerValue == null) return false; UUID owner = UUID.fromString(ownerValue);\n        ICommodity commodity = decode(reservation);\n        if (commodity instanceof ItemCommodity) { NonNullList<ItemStack> stacks = decodeStacks(level, reservation); return stacks != null && VaultManager.insertItemStacksToVaults(level, owner, stacks).isEmpty(); }\n        if (commodity instanceof FluidCommodity fluid) return TankManager.insertFluidToTanks(level, owner, new EconomyFluidStack(fluid.getFluid(), reservation.amount())) == reservation.amount();\n        return false;\n    }\n\n    @Override public String describe(ServerLevel level, UUID owner) { return "Economy Vaults and Tanks"; }\n    private static ICommodity decode(StorageReservation reservation) { EconomyId typeId = EconomyId.parse(reservation.metadata().getOrDefault(TYPE, ICommodity.ITEM_TYPE.toString())); return EconomyApi.commodityTypes().require(typeId).decode(reservation.commodityId(), CommodityPayload.empty(1)); }\n    private static String encodeStacks(ServerLevel level, Collection<ItemStack> stacks) { List<String> out=new ArrayList<>(); for(ItemStack stack:stacks) if(stack!=null&&!stack.isEmpty()) out.add(Base64.getEncoder().encodeToString(com.nstut.economy.compat.Compat.serializeItemStack(level, stack.copy()).getBytes(StandardCharsets.UTF_8))); return String.join(",",out); }\n    private static NonNullList<ItemStack> decodeStacks(ServerLevel level, StorageReservation reservation) { String raw=reservation.metadata().get(STACKS); if(raw==null) return null; NonNullList<ItemStack> out=NonNullList.create(); if(raw.isEmpty()) return out; for(String part:raw.split(",")) { ItemStack stack=com.nstut.economy.compat.Compat.deserializeItemStack(level,new String(Base64.getDecoder().decode(part),StandardCharsets.UTF_8)); if(!stack.isEmpty()) out.add(stack); } return out; }\n    private static NonNullList<ItemStack> takePrefix(Collection<ItemStack> stacks,int amount){ NonNullList<ItemStack> out=NonNullList.create(); int left=amount; for(ItemStack s:stacks){ if(left<=0)break; int n=Math.min(left,s.getCount()); ItemStack c=s.copy(); c.setCount(n); out.add(c); left-=n;} return out; }\n    private static NonNullList<ItemStack> dropPrefix(Collection<ItemStack> stacks,int amount){ NonNullList<ItemStack> out=NonNullList.create(); int drop=amount; for(ItemStack s:stacks){ if(drop>=s.getCount()){drop-=s.getCount();continue;} ItemStack c=s.copy(); if(drop>0){c.shrink(drop);drop=0;} if(!c.isEmpty())out.add(c);} return out; }\n    private static NonNullList<ItemStack> generateItemStacks(Item item,int amount){ NonNullList<ItemStack> result=NonNullList.create(); int max=com.nstut.economy.compat.Compat.maxStackSize(item); for(int remaining=amount;remaining>0;){int count=Math.min(remaining,max);result.add(new ItemStack(item,count));remaining-=count;} return result; }\n}\n''')

          # Cross-version exact ItemStack persistence helpers.
          p='common-1.21.1/src/main/java/com/nstut/economy/compat/Compat.java'; s=read(p)
          s=s.replace('import net.minecraft.resources.ResourceLocation;','import com.mojang.brigadier.exceptions.CommandSyntaxException;\nimport net.minecraft.nbt.CompoundTag;\nimport net.minecraft.nbt.TagParser;\nimport net.minecraft.resources.ResourceLocation;\nimport net.minecraft.server.level.ServerLevel;')
          s=s.replace('\n}','''\n\n    public static String serializeItemStack(ServerLevel level, ItemStack stack) {\n        CompoundTag tag = new CompoundTag(); stack.save(level.registryAccess(), tag); return tag.toString();\n    }\n    public static ItemStack deserializeItemStack(ServerLevel level, String serialized) {\n        try { return ItemStack.parseOptional(level.registryAccess(), TagParser.parseTag(serialized)); }\n        catch (CommandSyntaxException e) { throw new IllegalArgumentException("Invalid persisted ItemStack SNBT", e); }\n    }\n}\n''')
          write(p,s)
