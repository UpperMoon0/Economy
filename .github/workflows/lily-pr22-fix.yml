jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/addon-api-platform
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def rep(path, old, new, expected=None):
              s=read(path); n=s.count(old)
              if expected is not None and n != expected: raise SystemExit(f'{path}: expected {expected} occurrences, got {n}: {old[:80]}')
