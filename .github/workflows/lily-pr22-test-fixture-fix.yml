name: Lily PR22 regression fixture fix
on:
  push:
    branches: [feat/addon-api-platform]
    paths: [.github/workflows/lily-pr22-test-fixture-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/addon-api-platform
          fetch-depth: 0
      - name: Fix default-method fixture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('forge-1.20.1/src/test/java/com/nstut/economy/api/AddonApiReviewRegressionTest.java')
          text = path.read_text()
          old = '''        IStorageProvider noSplitProvider = new FixtureProvider() {\n            @Override\n            public Optional<StorageReservation> remainingAfterDelivery(ServerLevel level,\n                                                                      StorageReservation reservation,\n                                                                      int deliveredAmount) {\n                return IStorageProvider.super.remainingAfterDelivery(level, reservation, deliveredAmount);\n            }\n        };'''
          new = '''        IStorageProvider noSplitProvider = new IStorageProvider() {\n            @Override public EconomyId id() { return EconomyId.of("reviewfixture", "no_split"); }\n            @Override public boolean supports(ICommodity value) { return true; }\n            @Override public int available(ServerLevel level, UUID owner, ICommodity value) { return 10; }\n            @Override public int receivable(ServerLevel level, UUID owner, ICommodity value, int requested) { return requested; }\n            @Override public Optional<StorageReservation> reserve(ServerLevel level, UUID owner, ICommodity value, int amount) { return Optional.empty(); }\n            @Override public int deliverReserved(ServerLevel level, StorageReservation value, UUID receiver, int amount) { return amount; }\n            @Override public boolean release(ServerLevel level, StorageReservation value) { return true; }\n        };'''
          if text.count(old) != 1:
              raise SystemExit('expected no-split provider fixture not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/lily-pr22-test-fixture-fix.yml').unlink()
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name Lily
          git config user.email lily@local.invalid
          git add -A
          git commit -m "test: fix provider default-method fixture"
          git push origin HEAD:feat/addon-api-platform
