name: Live client join test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/**"
      - "common-1.20.1/**"
      - "common-1.21.1/**"
      - "shared/**"
      - "fabric-1.20.1/**"
      - "forge-1.20.1/**"
      - "fabric-1.21.1/**"
      - "neoforge-1.21.1/**"
      - "neoforge-26.1.2/**"
      - "tools/live_join_test.py"
      - ".github/workflows/live-join-test.yml"

jobs:
  live-join:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - fabric-1.20.1
          - forge-1.20.1
          - fabric-1.21.1
          - neoforge-1.21.1
    steps:
      - uses: actions/checkout@v4
      - name: Checkout OpenUI MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 82a5dd2f0e6c6027f20ca2acf049858f7f96f597
          path: .openui-mc
      - name: Set up supported JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
          cache: gradle
      - name: Install virtual display
        run: sudo apt-get update -o Acquire::Retries=3 || true; sudo apt-get install -y --no-install-recommends xvfb || true
      - name: Make Gradle executable
        run: chmod +x gradlew .openui-mc/gradlew
      - name: Install matching OpenUI MC artifact
        shell: bash
        run: |
          for target in :common-1.20.1 :fabric-1.20.1 :forge-1.20.1 :common-1.21.1 :fabric-1.21.1 :neoforge-1.21.1 :neoforge-26.1.2; do
            ./.openui-mc/gradlew -p .openui-mc "$target:publishToMavenLocal" --no-daemon
          done
      - name: Run automatic real-client join test
        run: python3 tools/live_join_test.py --target "${{ matrix.target }}"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-join-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/live-join/client/logs
            ${{ matrix.target }}/run/live-join/server/logs
          if-no-files-found: ignore
