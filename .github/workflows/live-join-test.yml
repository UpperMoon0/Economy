name: Live client join test

# Executed automatically by build-and-release.yml on PRs; the pull_request
# trigger is omitted so PRs do not run the same suite twice.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  prepare-openui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache OpenUI Maven Local
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0.0.8-c78235fa7194e295ed5e3e7e3f2aec1418efcfe5
      - name: Checkout OpenUI MC
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: c78235fa7194e295ed5e3e7e3f2aec1418efcfe5
          path: .openui-mc
      - name: Set up OpenUI build JDK
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Make OpenUI Gradle executable
        if: steps.cache-openui.outputs.cache-hit != 'true'
        run: chmod +x .openui-mc/gradlew
      - name: Install OpenUI MC artifacts
        if: steps.cache-openui.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./.openui-mc/gradlew -p .openui-mc \
            :common-1.20.1:publishToMavenLocal \
            :fabric-1.20.1:publishToMavenLocal \
            :forge-1.20.1:publishToMavenLocal \
            :common-1.21.1:publishToMavenLocal \
            :fabric-1.21.1:publishToMavenLocal \
            :neoforge-1.21.1:publishToMavenLocal \
            :neoforge-26.1.2:publishToMavenLocal \
            --no-parallel --no-daemon
      - name: Upload OpenUI Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut
          if-no-files-found: error

  live-join:
    needs: prepare-openui
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.20.1
            java: 21
          - target: forge-1.20.1
            java: 21
          - target: fabric-1.21.1
            java: 21
          - target: neoforge-1.21.1
            java: 21
          # Gradle runs on Java 21; ModDevGradle provisions the Java 25 toolchain.
          - target: neoforge-26.1.2
            java: 21
    steps:
      - uses: actions/checkout@v4
      - name: Restore OpenUI Maven Local Cache
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0.0.8-c78235fa7194e295ed5e3e7e3f2aec1418efcfe5
      - name: Download OpenUI Maven Artifacts Fallback
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut
      - name: Set up target JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Install virtual display
        run: sudo apt-get update -o Acquire::Retries=3 || true; sudo apt-get install -y --no-install-recommends xvfb || true
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run automatic real-client join test
        run: python3 tools/live_join_test.py --target "${{ matrix.target }}"
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-join-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/live-join/client/logs
            ${{ matrix.target }}/run/live-join/server/logs
          if-no-files-found: ignore
