name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Checkout OpenUI-MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: main
          path: OpenUI-MC

      - name: Set up JDK 21 for OpenUI
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Gradle wrapper permissions
        run: |
          chmod +x gradlew
          chmod +x OpenUI-MC/gradlew

      - name: Publish OpenUI-MC to Maven Local
        working-directory: OpenUI-MC
        run: |
          WANT_VER=$(grep -oE 'openui-mc-forge-1\.20\.1:[0-9.]+' ../forge-1.20.1/build.gradle | head -n1 | cut -d: -f2)
          CUR_VER=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          if [[ -n "$WANT_VER" && "$CUR_VER" != "$WANT_VER" ]]; then
            echo "Pinning published OpenUI version $CUR_VER -> $WANT_VER to match Economy's dependency"
            sed -i "s/^mod_version[[:space:]]*=.*/mod_version = ${WANT_VER}/" gradle.properties
          fi
          ./gradlew :forge-1.20.1:publishToMavenLocal --no-daemon

      - name: Set up JDK 17 for Economy
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew :forge-1.20.1:build --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: economy-mod-jars
          path: forge-1.20.1/build/libs/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: economy-mod-jars
          path: build/release-libs
      - name: Determine Release Tag
        id: tag
        run: |
          MOD_VER=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG_NAME="${{ github.ref_name }}"; else TAG_NAME="v${MOD_VER}"; fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "changelog_path=changelogs/v${MOD_VER}.md" >> $GITHUB_OUTPUT
          test -f "changelogs/v${MOD_VER}.md"
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: build/release-libs/*.jar
          body_path: ${{ steps.tag.outputs.changelog_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: "1624849"
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi
          if [[ ! "${CURSEFORGE_PROJECT_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "Missing or invalid required secret: CURSEFORGE_PROJECT_ID" >&2
            exit 1
          fi

          mapfile -t jars < <(find build/release-libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runnable Economy jar, found ${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          changelog_path="changelogs/v${mod_version}.md"
          if [[ ! -f "$changelog_path" ]]; then
            echo "Missing release changelog: ${changelog_path}" >&2
            exit 1
          fi
          changelog="$(<"$changelog_path")"
          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "NsTut Economy ${mod_version} - Forge 1.20.1" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: ["1.20.1", "Forge", "Java 17", "Client", "Server"],
              releaseType: "release",
              relations: {
                projects: [{
                  slug: "openui-mc",
                  projectID: "1661978",
                  type: "requiredDependency"
                }]
              }
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${jars[0]}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"
          if [[ "$http_status" =~ ^2 ]]; then
            file_id="$(jq -er '.id' <<< "$response")"
            echo "Published Economy to CurseForge as file ID ${file_id}."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has this Economy artifact; treating retry as successful."
          else
            echo "CurseForge upload failed with HTTP ${http_status}: ${response}" >&2
            exit 1
          fi
