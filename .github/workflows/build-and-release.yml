name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release from main
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-gate:
    name: Check release trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for version bump
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail
          should_release=false
          current="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$current" ]]; then
            echo "Failed to read mod_version" >&2
            exit 1
          fi
          expected="v${current}"
          if [[ "$REF" == refs/tags/* && "${REF#refs/tags/}" != "$expected" ]]; then
            echo "Tag ${REF#refs/tags/} does not match mod_version $current" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" == "refs/heads/main" && "$MANUAL_RELEASE" == "true" ]]; then
              should_release=true
            fi
          elif [[ "$REF" == refs/tags/* ]]; then
            should_release=true
          elif [[ "$EVENT_NAME" == "push" && ( "$REF" == "refs/heads/main" || "$REF" == "refs/heads/master" ) ]]; then
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "Cannot resolve previous push commit $BEFORE" >&2
              exit 1
            fi
            previous="$(git show "$BEFORE":gradle.properties | sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' | head -n1 | tr -d '\r' | xargs)"
            if [[ -n "$current" && "$current" != "$previous" ]]; then
              should_release=true
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Release trigger: $should_release"

  prepare-openui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache OpenUI Maven Local
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0.0.8-2500118e4b18fdd54a7ad910c73e5383c5600024

      - name: Checkout OpenUI-MC
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 2500118e4b18fdd54a7ad910c73e5383c5600024
          path: OpenUI-MC

      - name: Verify OpenUI-MC version alignment
        if: steps.cache-openui.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^openui_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          actual="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' OpenUI-MC/gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$expected" || -z "$actual" ]]; then
            echo "Failed to parse OpenUI versions." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n%s' "$expected" "$actual" | sort -V | head -n1)" != "$expected" ]]; then
            echo "OpenUI version mismatch: Economy requires >= '$expected' but OpenUI-MC publishes '$actual'." >&2
            exit 1
          fi

      - name: Set up JDK 21 for OpenUI
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make OpenUI gradlew executable
        if: steps.cache-openui.outputs.cache-hit != 'true'
        run: chmod +x OpenUI-MC/gradlew

      - name: Publish OpenUI-MC to Maven Local
        if: steps.cache-openui.outputs.cache-hit != 'true'
        working-directory: OpenUI-MC
        shell: bash
        run: |
          ./gradlew \
            :common-1.20.1:publishToMavenLocal \
            :fabric-1.20.1:publishToMavenLocal \
            :forge-1.20.1:publishToMavenLocal \
            :common-1.21.1:publishToMavenLocal \
            :fabric-1.21.1:publishToMavenLocal \
            :neoforge-1.21.1:publishToMavenLocal \
            :neoforge-26.1.2:publishToMavenLocal \
            --no-parallel --no-daemon

      - name: Upload OpenUI Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut
          if-no-files-found: error

  test-shared:
    needs: prepare-openui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore OpenUI Maven Local Cache
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0.0.8-2500118e4b18fdd54a7ad910c73e5383c5600024
      - name: Download OpenUI Maven Artifacts Fallback
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - run: chmod +x gradlew
      - name: Run shared unit tests
        run: ./gradlew :common:test :common-1.20.1:test :common-1.21.1:test

  verify-and-build:
    needs: prepare-openui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.20.1
            java: 21
            build: true
          - target: forge-1.20.1
            java: 21
            build: true
          - target: fabric-1.21.1
            java: 21
            build: true
          - target: neoforge-1.21.1
            java: 21
            build: true
          # Gradle runs on Java 21; ModDevGradle provisions the Java 25 toolchain.
          - target: neoforge-26.1.2
            java: 21
            build: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore OpenUI Maven Local Cache
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0.0.8-2500118e4b18fdd54a7ad910c73e5383c5600024

      - name: Download OpenUI Maven Artifacts Fallback
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut

      - name: Set up target JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test ${{ matrix.target }}
        run: ./gradlew :${{ matrix.target }}:test

      - name: Build ${{ matrix.target }}
        if: matrix.build
        run: ./gradlew :${{ matrix.target }}:build

      - name: Upload release artifact
        if: matrix.build
        uses: actions/upload-artifact@v4
        with:
          name: economy-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/libs/economy-${{ matrix.target }}-*.jar
            !${{ matrix.target }}/build/libs/*-sources.jar
            !${{ matrix.target }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  release:
    needs: [release-gate, test-shared, verify-and-build, live-client]
    if: needs.release-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: economy-*
          path: build/release-libs
      - name: Flatten downloaded jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-libs-flat
          find build/release-libs -type f -name 'economy-*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} build/release-libs-flat/ \;
          rm -rf build/release-libs
          mv build/release-libs-flat build/release-libs
          ls -la build/release-libs
      - name: Determine Release Tag
        id: tag
        run: |
          MOD_VER=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG_NAME="${{ github.ref_name }}"; else TAG_NAME="v${MOD_VER}"; fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "changelog_path=changelogs/v${MOD_VER}.md" >> $GITHUB_OUTPUT
          test -f "changelogs/v${MOD_VER}.md"
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: build/release-libs/*.jar
          body_path: ${{ steps.tag.outputs.changelog_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: "1624849"
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi
          if [[ ! "${CURSEFORGE_PROJECT_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "Missing or invalid required secret: CURSEFORGE_PROJECT_ID" >&2
            exit 1
          fi

          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          changelog_path="changelogs/v${mod_version}.md"
          if [[ ! -f "$changelog_path" ]]; then
            echo "Missing release changelog: ${changelog_path}" >&2
            exit 1
          fi
          changelog="$(<"$changelog_path")"

          targets=(
            "fabric-1.20.1:Fabric:1.20.1:Java 17"
            "forge-1.20.1:Forge:1.20.1:Java 17"
            "fabric-1.21.1:Fabric:1.21.1:Java 21"
            "neoforge-1.21.1:NeoForge:1.21.1:Java 21"
            "neoforge-26.1.2:NeoForge:26.1.2:Java 25"
          )

          for entry in "${targets[@]}"; do
            IFS=':' read -r target_key loader mc_ver java_ver <<< "$entry"
            jar_file=$(find build/release-libs -type f -name "economy-${target_key}-*.jar" ! -name '*-sources.jar' ! -name '*-dev*.jar' | head -n1)
            if [[ -z "$jar_file" || ! -f "$jar_file" ]]; then
              echo "Missing required release jar for target ${target_key} in build/release-libs" >&2
              exit 1
            fi

            display_name="NsTut Economy ${mod_version} - ${loader} ${mc_ver}"
            echo "Publishing ${display_name} (${jar_file})..."

            metadata="$(jq -cn \
              --arg changelog "$changelog" \
              --arg displayName "$display_name" \
              --arg mcVer "$mc_ver" \
              --arg loader "$loader" \
              --arg javaVer "$java_ver" \
              '{
                changelog: $changelog,
                changelogType: "markdown",
                displayName: $displayName,
                gameVersionNames: [$mcVer, $loader, $javaVer, "Client", "Server"],
                releaseType: "release",
                relations: {
                  projects: [{
                    slug: "openui-mc",
                    projectID: 1661978,
                    type: "requiredDependency"
                  }]
                }
              }')"

            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
              --form-string "metadata=${metadata}" \
              --form "file=@${jar_file}" \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
            response="$(<"$response_file")"
            rm -f "$response_file"

            if [[ "$http_status" =~ ^2 ]]; then
              file_id="$(jq -er '.id' <<< "$response")"
              echo "Published ${display_name} to CurseForge as file ID ${file_id}."
            elif grep -Eqi 'already|duplicate' <<< "$response"; then
              echo "CurseForge already has ${display_name}; treating retry as successful."
            else
              echo "CurseForge upload failed for ${display_name} with HTTP ${http_status}: ${response}" >&2
              exit 1
            fi
          done

  live-client:
    name: Live client join compatibility
    needs: prepare-openui
    uses: ./.github/workflows/live-join-test.yml
