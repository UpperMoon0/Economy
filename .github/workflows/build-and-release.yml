name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenUI-MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 7f9d853b0df39a3ea3e4fcfcfa0e18df042f4c9c
          path: OpenUI-MC

      - name: Verify OpenUI-MC version alignment
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^openui_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          actual="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' OpenUI-MC/gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$expected" || -z "$actual" ]]; then
            echo "Failed to parse OpenUI versions." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n%s' "$expected" "$actual" | sort -V | head -n1)" != "$expected" ]]; then
            echo "OpenUI version mismatch: Economy requires >= '$expected' but OpenUI-MC publishes '$actual'." >&2
            exit 1
          fi

      - name: Set up JDK 21 for OpenUI and Economy
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Gradle wrapper permissions
        run: |
          chmod +x gradlew
          chmod +x OpenUI-MC/gradlew

      - name: Publish OpenUI-MC to Maven Local
        working-directory: OpenUI-MC
        run: ./gradlew :forge-1.20.1:publishToMavenLocal --no-daemon

      - name: Build with Gradle
        run: ./gradlew :forge-1.20.1:build --no-daemon

  cross-version-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout OpenUI-MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 7f9d853b0df39a3ea3e4fcfcfa0e18df042f4c9c
          path: OpenUI-MC

      - name: Set up supported JDKs
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Gradle wrapper permissions
        run: |
          chmod +x gradlew
          chmod +x OpenUI-MC/gradlew

      - name: Publish every OpenUI-MC target to Maven Local
        working-directory: OpenUI-MC
        shell: bash
        run: |
          for target in :fabric-1.20.1 :forge-1.20.1 :fabric-1.21.1 :neoforge-1.21.1 :neoforge-26.1.2; do
            ./gradlew "$target:publishToMavenLocal" --no-daemon
          done

      - name: Test and build every Economy target
        run: ./gradlew testAllVersions buildAll --no-daemon

      - name: Upload release artifacts for every production target
        uses: actions/upload-artifact@v4
        with:
          name: economy-mod-jars
          path: |
            fabric-1.20.1/build/libs/economy-fabric-1.20.1-*.jar
            forge-1.20.1/build/libs/economy-forge-1.20.1-*.jar
            fabric-1.21.1/build/libs/economy-fabric-1.21.1-*.jar
            neoforge-1.21.1/build/libs/economy-neoforge-1.21.1-*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar

  release:
    needs: [build, cross-version-verification]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: economy-mod-jars
          path: build/release-libs
      - name: Flatten downloaded jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-libs-flat
          find build/release-libs -type f -name '*.jar' -exec cp {} build/release-libs-flat/ \;
          rm -rf build/release-libs
          mv build/release-libs-flat build/release-libs
          ls -la build/release-libs
      - name: Determine Release Tag
        id: tag
        run: |
          MOD_VER=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG_NAME="${{ github.ref_name }}"; else TAG_NAME="v${MOD_VER}"; fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "changelog_path=changelogs/v${MOD_VER}.md" >> $GITHUB_OUTPUT
          test -f "changelogs/v${MOD_VER}.md"
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: build/release-libs/*.jar
          body_path: ${{ steps.tag.outputs.changelog_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: "1624849"
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi
          if [[ ! "${CURSEFORGE_PROJECT_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "Missing or invalid required secret: CURSEFORGE_PROJECT_ID" >&2
            exit 1
          fi

          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          changelog_path="changelogs/v${mod_version}.md"
          if [[ ! -f "$changelog_path" ]]; then
            echo "Missing release changelog: ${changelog_path}" >&2
            exit 1
          fi
          changelog="$(<"$changelog_path")"

          targets=(
            "fabric-1.20.1:Fabric:1.20.1:Java 17"
            "forge-1.20.1:Forge:1.20.1:Java 17"
            "fabric-1.21.1:Fabric:1.21.1:Java 21"
            "neoforge-1.21.1:NeoForge:1.21.1:Java 21"
          )

          for entry in "${targets[@]}"; do
            IFS=':' read -r target_key loader mc_ver java_ver <<< "$entry"
            jar_file=$(find build/release-libs -type f -name "economy-${target_key}-*.jar" ! -name '*-sources.jar' ! -name '*-dev*.jar' | head -n1)
            if [[ -z "$jar_file" || ! -f "$jar_file" ]]; then
              echo "Missing required release jar for target ${target_key} in build/release-libs" >&2
              exit 1
            fi

            display_name="NsTut Economy ${mod_version} - ${loader} ${mc_ver}"
            echo "Publishing ${display_name} (${jar_file})..."

            metadata="$(jq -cn \
              --arg changelog "$changelog" \
              --arg displayName "$display_name" \
              --arg mcVer "$mc_ver" \
              --arg loader "$loader" \
              --arg javaVer "$java_ver" \
              '{
                changelog: $changelog,
                changelogType: "markdown",
                displayName: $displayName,
                gameVersionNames: [$mcVer, $loader, $javaVer, "Client", "Server"],
                releaseType: "release",
                relations: {
                  projects: [{
                    slug: "openui-mc",
                    projectID: 1661978,
                    type: "requiredDependency"
                  }]
                }
              }')"

            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
              --form-string "metadata=${metadata}" \
              --form "file=@${jar_file}" \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
            response="$(<"$response_file")"
            rm -f "$response_file"

            if [[ "$http_status" =~ ^2 ]]; then
              file_id="$(jq -er '.id' <<< "$response")"
              echo "Published ${display_name} to CurseForge as file ID ${file_id}."
            elif grep -Eqi 'already|duplicate' <<< "$response"; then
              echo "CurseForge already has ${display_name}; treating retry as successful."
            else
              echo "CurseForge upload failed for ${display_name} with HTTP ${http_status}: ${response}" >&2
              exit 1
            fi
          done
