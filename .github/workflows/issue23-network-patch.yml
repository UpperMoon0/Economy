name: Issue 23 network patch

on:
  push:
    branches:
      - feat/issue-23-variant-aware-commodities

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-23-variant-aware-commodities
          fetch-depth: 0
      - name: Apply asserted source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/issue23_network_patch.py")
          text = path.read_text(encoding="utf-8")
          needle = r"net\.minecraft\.resources\.Identifier\.parse"
          replacement = r"(?:net\.minecraft\.resources\.)?Identifier\.parse"
          count = text.count(needle)
          if count != 1:
              raise RuntimeError(f"expected exactly one 26.1.2 Identifier.parse matcher, found {count}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          python3 tools/issue23_network_patch.py
      - name: Verify exact patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm tools/issue23_network_patch.py .github/workflows/issue23-network-patch.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make market networking variant-aware'
          git push origin HEAD:feat/issue-23-variant-aware-commodities
