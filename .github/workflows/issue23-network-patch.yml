name: Issue 23 network patch

on:
  push:
    branches:
      - feat/issue-23-variant-aware-commodities

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-23-variant-aware-commodities
          fetch-depth: 0
      - name: Apply asserted source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path("tools/issue23_network_patch.py")
          patch_text = patch_path.read_text(encoding="utf-8")
          needle = r"net\.minecraft\.resources\.Identifier\.parse"
          replacement = r"(?:net\.minecraft\.resources\.)?Identifier\.parse"
          count = patch_text.count(needle)
          if count != 1:
              raise RuntimeError(f"expected exactly one 26.1.2 Identifier.parse matcher, found {count}")
          patch_path.write_text(patch_text.replace(needle, replacement), encoding="utf-8")

          source_path = Path("common-1.20.1/src/main/java/com/nstut/economy/data/EconomyTradeData.java")
          source = source_path.read_text(encoding="utf-8")
          start_token = 'data.trades.add(new TradeSnapshot(t.getString("ItemId"),'
          end_token = 't.getLong("Timestamp")));'
          start = source.find(start_token)
          if start < 0 or source.find(start_token, start + 1) >= 0:
              raise RuntimeError("expected exactly one 1.20.1 trade load constructor")
          end = source.find(end_token, start)
          if end < 0:
              raise RuntimeError("1.20.1 trade load constructor has no expected timestamp tail")
          end += len(end_token)
          segment = source[start:end]
          required = 't.contains("CommodityType") ? t.getString("CommodityType") : null'
          price_tail = 't.getString("Price"), t.getInt("Quantity"), t.getUUID("Buyer"), t.getUUID("Seller"), t.getLong("Timestamp")))'
          if required not in segment or price_tail not in segment:
              raise RuntimeError("1.20.1 trade load constructor changed semantically")
          normalized = 'data.trades.add(new TradeSnapshot(t.getString("ItemId"), t.contains("CommodityType") ? t.getString("CommodityType") : null,\n                        t.getString("Price"), t.getInt("Quantity"), t.getUUID("Buyer"), t.getUUID("Seller"), t.getLong("Timestamp")));'
          source_path.write_text(source[:start] + normalized + source[end:], encoding="utf-8")
          PY
          python3 tools/issue23_network_patch.py
      - name: Verify exact patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm tools/issue23_network_patch.py .github/workflows/issue23-network-patch.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make market networking variant-aware'
          git push origin HEAD:feat/issue-23-variant-aware-commodities
