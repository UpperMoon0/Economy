pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'economy'

// A targeted neoforge-26.1.2 invocation must not configure the legacy Loom
// projects. Besides being faster, this keeps IDE-held mapping locks from
// blocking the standalone ModDevGradle client/server runs.
def allProjects = [
        'common',
        'common-1.20.1', 'fabric-1.20.1', 'forge-1.20.1',
        'common-1.21.1', 'fabric-1.21.1', 'neoforge-1.21.1',
        'neoforge-26.1.2'
] as Set
def requestedTasks = gradle.startParameter.taskNames
def targetedProjects = requestedTasks
        .findAll { it.startsWith(':') }
        .collect { it.split(':')[1] }
        .findAll { it in allProjects } as Set
def needsWholeWorkspace = requestedTasks.isEmpty() || requestedTasks.any {
    !it.startsWith(':') || it in ['buildAll', 'testAllVersions']
}

def selected = [] as Set
if (needsWholeWorkspace || targetedProjects.isEmpty()) {
    selected.addAll(allProjects)
} else {
    targetedProjects.each { projectName ->
        switch (projectName) {
            case 'fabric-1.20.1':
            case 'forge-1.20.1':
                selected.addAll(['common', 'common-1.20.1', projectName])
                break
            case 'fabric-1.21.1':
            case 'neoforge-1.21.1':
                selected.addAll(['common', 'common-1.21.1', projectName])
                break
            case 'common-1.20.1':
            case 'common-1.21.1':
                selected.addAll(['common', projectName])
                break
            default:
                selected.add(projectName)
        }
    }
}
selected.each { include it }
