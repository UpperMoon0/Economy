// Pure Java library - no Minecraft dependencies
// Contains code shared across all Minecraft versions (1.20.1, 1.21.1, 26.1.2)

plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

group = rootProject.maven_group
version = rootProject.mod_version

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

// Binary compatibility fixture: compile consumer bytecode against the v0.0.13 public
// EconomyEvents descriptor, then run that bytecode with the current API implementation.
// If a shipped symbol is removed, execution fails with NoSuchMethodError.
sourceSets {
    legacy013ApiStub {
        java.srcDir 'src/legacy013ApiStub/java'
    }
    legacy013BinaryFixture {
        java.srcDir 'src/legacy013BinaryFixture/java'
        compileClasspath = sourceSets.legacy013ApiStub.output
    }
}

dependencies {
    // SLF4J API for logging (implementation provided by Minecraft)
    compileOnly "org.slf4j:slf4j-api:2.0.9"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

tasks.named('compileLegacy013BinaryFixtureJava', JavaCompile).configure {
    dependsOn tasks.named('compileLegacy013ApiStubJava')
    options.release = 17
}

tasks.register('verifyLegacy013BinaryCompatibility', JavaExec) {
    group = 'verification'
    description = 'Runs consumer bytecode compiled against the Economy 0.0.13 API on the current implementation.'
    dependsOn tasks.named('compileLegacy013BinaryFixtureJava'), tasks.named('classes')
    classpath = sourceSets.legacy013BinaryFixture.output + sourceSets.main.runtimeClasspath
    mainClass = 'example.economyaddon.v013.Legacy013EventAddon'
}

tasks.named('test').configure {
    dependsOn tasks.named('verifyLegacy013BinaryCompatibility')
}
