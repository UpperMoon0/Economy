plugins {
    id 'com.gradleup.shadow'
}

def commonProject = project(':common-1.20.1')
ext.minecraft_version = commonProject.minecraft_version
ext.architectury_api_version = commonProject.architectury_api_version
ext.forge_version = commonProject.forge_version
def economyModId = rootProject.mod_id

loom {
    forge {
    }
    runs {
        gameTestServer {
            server()
            environment("gametestserver")
            runDir("run/gametest")
            property "forge.enabledGameTestNamespaces", economyModId
        }
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            property "economy.liveJoinTest", "true"
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25575"
        }
        liveJoinTestServer {
            server()
            runDir("run/live-join/server")
            programArg "nogui"
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$project.forge_version"

    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"

    // OpenUI's production Forge jar is SRG-named. Loom 1.11 incorrectly remaps
    // it as an intermediary jar on the development classpath, corrupting every
    // Minecraft type descriptor. Use the published named development artifact
    // for compilation/runs; Economy still declares the normal OpenUI mod as an
    // external runtime dependency in mods.toml and never bundles this jar.
    compileOnly "com.nstut:openui-mc-forge-1.20.1:${rootProject.openui_version}:dev-shadow"
    runtimeOnly "com.nstut:openui-mc-forge-1.20.1:${rootProject.openui_version}:dev-shadow"

    implementation project(':common')

    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionForge')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile a consumer-shaped fixture independently from the normal test source
// set. It deliberately lives outside com.nstut and its imports are checked so
// the fixture cannot silently rely on Economy implementation packages.
sourceSets {
    addonFixture {
        java.srcDir 'src/addonFixture/java'
        compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

tasks.register('verifyAddonFixtureApiBoundary') {
    group = 'verification'
    description = 'Ensures the external addon fixture imports Economy only through com.nstut.economy.api.'
    inputs.files(sourceSets.addonFixture.java)
    doLast {
        def violations = []
        sourceSets.addonFixture.java.files.each { source ->
            source.eachLine { line, number ->
                def trimmed = line.trim()
                if (trimmed.startsWith('import com.nstut.economy.')
                        && !trimmed.startsWith('import com.nstut.economy.api.')) {
                    violations << "${source}:$number: $trimmed"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('External addon fixture crossed the public API boundary:\n' + violations.join('\n'))
        }
    }
}

tasks.named('compileAddonFixtureJava', JavaCompile).configure {
    dependsOn tasks.named('verifyAddonFixtureApiBoundary')
    options.release = 17
}

tasks.named('check').configure {
    dependsOn tasks.named('compileAddonFixtureJava')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'economy.repoRoot', rootProject.projectDir.absolutePath
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'archives_name', rootProject.archives_name
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_description', rootProject.mod_description
    inputs.property 'mod_authors', rootProject.mod_authors
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_version_range', project.findProperty('forge_version_range') ?: '[47,48)'
    inputs.property 'loader_version_range', project.findProperty('loader_version_range') ?: '[47,48)'
    inputs.property 'minecraft_version_range', project.findProperty('minecraft_version_range') ?: '[1.20.1,1.21)'
    inputs.property 'openui_version', rootProject.openui_version
    inputs.property 'mod_license', rootProject.findProperty('mod_license') ?: 'All Rights Reserved'
    inputs.property 'issue_tracker_url', rootProject.findProperty('issue_tracker_url') ?: 'https://github.com/UpperMoon0/Economy/issues'

    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                archives_name: rootProject.archives_name,
                mod_name: rootProject.mod_name,
                mod_description: rootProject.mod_description,
                mod_authors: rootProject.mod_authors,
                minecraft_version: project.minecraft_version,
                forge_version_range: project.findProperty('forge_version_range') ?: '[47,48)',
                loader_version_range: project.findProperty('loader_version_range') ?: '[47,48)',
                minecraft_version_range: project.findProperty('minecraft_version_range') ?: '[1.20.1,1.21)',
                openui_version: rootProject.openui_version,
                mod_license: rootProject.findProperty('mod_license') ?: 'All Rights Reserved',
                issue_tracker_url: rootProject.findProperty('issue_tracker_url') ?: 'https://github.com/UpperMoon0/Economy/issues'
    }
}

// GameTest classes/templates are development-only. They stay on the dev run
// classpath but are not shipped in production artifacts.
tasks.withType(Jar).configureEach {
    exclude 'com/nstut/forge/gametest/**'
    exclude 'data/economy/structures/economy_gametest_empty.nbt'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

test {
    useJUnitPlatform()
}
