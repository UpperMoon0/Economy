modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/nstut/economy/issues"

[[mods]]
modId = "economy"
version = "${version}"
displayName = "NsTut Economy"
authors = "NsTut"
description = '''
A modern order-book economy with unified item and fluid trading, physical Vault and Tank storage, automated order matching, persistent market orders, portfolio tracking, player transfers, and a full in-game Market Terminal.
'''

[[dependencies.economy]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.economy]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
