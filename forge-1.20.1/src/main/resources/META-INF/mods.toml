modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/nstut/economy/issues"

[[mods]]
modId = "economy"
version = "${version}"
displayName = "NsTut Economy"
authors = "NsTut"
description = '''
A modern, feature-rich Minecraft Economy mod featuring a full Order Book Market Terminal UI, Vault physical storage integration, player-to-player transfers, automated order matching, and sound-effect enabled financial transactions.
'''

[[dependencies.economy]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.economy]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
