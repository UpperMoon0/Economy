modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/nstut/economy/issues"

[[mods]]
modId = "economy"
version = "${version}"
displayName = "NsTut Economy"
authors = "NsTut"
description = '''
A player-driven item and fluid economy with an OpenUI-powered Market Terminal, matched orders, portfolio tracking, payments, and market-connected Vault and Fluid Tank storage.
'''

[[dependencies.economy]]
modId = "openui_mc"
mandatory = true
versionRange = "[0.0.5,1)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.economy]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.economy]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
